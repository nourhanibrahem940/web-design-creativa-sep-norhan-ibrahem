<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flip card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section>
        <div class="container">
            <div class="flip-card">
                <div class="product-card">
                    <div class="front">
                        <img class="img" src="images/7c6c1a8fed71622d0a826b36be93fca8.jpg" alt="">
                        <h1 class="h1-absolute">not just for special occasions<br>makeup is for mondays.<br>for coffe runs. for study days</h1>
                        
                    </div>
                    <div class="back">
                        <div class="text">
                            <div class="jump">
                                  <h3 class="text-brown">not just for special occasions</h3>
                                  <p >makeup is for mondays.<br>for coffe runs. for study days</p>
                                  <h3 class="text-brown">for you.</h3>
                            </div>
                          
                            <p class="padding-top text-grey">makeup isn't a mask, it's a tool-just like fasion, just like words, use it whenever you want </p>
                            <div class="button">
                                <i class="fa-solid fa-arrow-right p-absolute icon"></i>
                                <h6 class="p-relative h6">read more</h6>
                            </div>


                        </div>
                        
                       
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
